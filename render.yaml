services:
  - type: web
    name: nexo-operacoes-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w apps/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_ADMIN_URL
        sync: false
      - key: DATABASE_APP_PASSWORD
        sync: false
