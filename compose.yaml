services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo_owner
      POSTGRES_PASSWORD: local_owner_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo_owner -d nexo"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
